<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="가계부" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>가계부</title>
    <style>
      html, body { margin: 0; background: #f9fafb; -webkit-tap-highlight-color: transparent; }
      * { box-sizing: border-box; }
      button, input, select { font-family: inherit; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      /* 아이폰에서 입력칸 누르면 화면이 확대되는 문제 방지 */
      @media (pointer: coarse) { input, select, textarea { font-size: 16px !important; } }
      /* 아이폰에서 날짜 칸이 화면 밖으로 삐져나가는 문제 방지 */
      input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; min-height: 44px; text-align: left; }
      input[type="date"]::-webkit-date-and-time-value { text-align: left; }
      input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
    </style>
    <script type="module" crossorigin src="/app.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
